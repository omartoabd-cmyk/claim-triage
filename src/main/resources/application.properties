spring.application.name=insuranceclaims

# --- OpenAI -----------------------------------------------------------------
# NEVER hardcode the key. Export OPENAI_API_KEY before starting the app.
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# --- Database ---------------------------------------------------------------
# File-based H2 so claims and analyses survive restarts (stored in ./data).
# Swap for PostgreSQL in production.
spring.datasource.url=jdbc:h2:file:./data/claims
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Web --------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

# --- Cost protection for the AI endpoint ------------------------------------
app.rate-limit.per-client-per-minute=5
app.rate-limit.global-per-hour=100
